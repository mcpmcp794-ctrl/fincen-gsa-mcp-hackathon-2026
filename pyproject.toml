[project]
name = "fraud-transaction-mcp"
version = "0.1.0"
description = "MCP server for read-only analysis of synthetic card transactions on Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "databricks-sql-connector>=3.4",
    "databricks-sdk>=0.30",
    "pydantic-settings>=2.0",
    "sqlglot>=25",
]

[project.scripts]
fraud-transaction-mcp = "fraud_transaction_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_transaction_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "ruff>=0.6.0",
]
client = [
    "openai>=1.40",
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["*.md", "evaluation/reports"]

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests"]
pythonpath = ["src"]
